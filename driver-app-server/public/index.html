
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALSAQQAF LOGISTICS LLC — Driver Application</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:#f3f4f6;margin:0}
    .wrap{max-width:900px;margin:30px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    header{background:linear-gradient(135deg,#2c5aa0,#1e3a8a);color:#fff;padding:28px}
    header h1{margin:0;font-size:22px}
    header p{opacity:.9;margin-top:6px}
    main{padding:28px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .row-1{display:grid;grid-template-columns:1fr;gap:16px}
    label{display:block;font-weight:600;margin-bottom:6px}
    input,select{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px}
    input:focus,select:focus{outline:none;border-color:#2c5aa0;box-shadow:0 0 0 3px rgba(44,90,160,.12)}
    .actions{display:flex;gap:12px;margin-top:20px}
    button{background:#2c5aa0;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .note{background:#fef3c7;border:1px solid #fde68a;padding:12px;border-radius:10px;margin-bottom:20px}
    .ok{color:#059669;font-weight:700;display:none;margin-left:8px}
    .error{color:#dc2626;font-weight:600;display:none;margin-top:10px}
    .logo{display:flex;align-items:center;gap:12px}
    .logo img{height:42px}
    footer{padding:18px;background:#f9fafb;border-top:1px solid #e5e7eb;text-align:center;color:#6b7280}
    @media (max-width:720px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <img src="/logo.png" alt="Logo" onerror="this.style.display='none'"/>
        <div>
          <h1>ALSAQQAF LOGISTICS LLC</h1>
          <p>Professional Driver Application</p>
        </div>
      </div>
    </header>
    <main>
      <div class="note">🔒 Your information will be used only for hiring purposes. Required fields are marked.</div>

      <form id="appForm">
        <h2>Personal Information</h2>
        <div class="row">
          <div>
            <label>First Name *</label>
            <input name="firstName" required />
          </div>
          <div>
            <label>Last Name *</label>
            <input name="lastName" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Email *</label>
            <input type="email" name="email" required />
          </div>
          <div>
            <label>Phone *</label>
            <input type="tel" name="phone" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Date of Birth</label>
            <input type="date" name="dateOfBirth" />
          </div>
          <div>
            <label>SSN (###-##-####)</label>
            <input name="ssn" placeholder="123-45-6789"/>
          </div>
        </div>

        <h2 style="margin-top:22px">Address</h2>
        <div class="row-1">
          <div>
            <label>Street Address</label>
            <input name="currentAddress"/>
          </div>
        </div>
        <div class="row">
          <div>
            <label>City</label>
            <input name="currentCity"/>
          </div>
          <div>
            <label>State</label>
            <select name="currentState">
              <option value="">Select State</option>
              <option value="MI">Michigan</option>
              <option value="OH">Ohio</option>
              <option value="IN">Indiana</option>
              <option value="IL">Illinois</option>
              <option value="WI">Wisconsin</option>
              <option value="PA">Pennsylvania</option>
              <option value="NY">New York</option>
              <option value="CA">California</option>
              <option value="TX">Texas</option>
              <!-- (short list here for brevity) -->
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>ZIP</label>
            <input name="currentZip"/>
          </div>
          <div>
            <label>Years at Current Address</label>
            <input type="number" step="0.1" min="0" name="yearsAtCurrent"/>
          </div>
        </div>

        <h2 style="margin-top:22px">Preferences</h2>
        <div class="row">
          <div>
            <label>Preferred Work Schedule</label>
            <select name="workSchedule">
              <option value="">Select</option>
              <option>Full-time</option>
              <option>Part-time</option>
              <option>Local Daily</option>
              <option>Regional</option>
              <option>OTR</option>
            </select>
          </div>
          <div>
            <label>Available Start Date</label>
            <input type="date" name="availableStartDate"/>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Weekend Availability</label>
            <select name="weekendAvailability">
              <option value="">Select</option>
              <option>Yes</option>
              <option>Limited</option>
              <option>No</option>
            </select>
          </div>
          <div>
            <label>Overtime Willing</label>
            <select name="overtimeWilling">
              <option value="">Select</option>
              <option>Yes</option>
              <option>Limited</option>
              <option>No</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Travel Tolerance</label>
            <select name="travelTolerance">
              <option value="">Select</option>
              <option>Local only</option>
              <option>Regional</option>
              <option>OTR (2 weeks)</option>
              <option>OTR (1 month)</option>
              <option>Extended OTR</option>
            </select>
          </div>
        </div>

        <h2 style="margin-top:22px">Emergency Contact</h2>
        <div class="row">
          <div>
            <label>Name</label>
            <input name="emergencyName"/>
          </div>
          <div>
            <label>Relationship</label>
            <input name="emergencyRelationship"/>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Phone</label>
            <input name="emergencyPhone"/>
          </div>
          <div>
            <label>Email</label>
            <input type="email" name="emergencyEmail"/>
          </div>
        </div>

        <div class="actions">
          <button type="submit">Submit Application</button>
          <span id="ok" class="ok">✅ Sent!</span>
        </div>
        <div id="err" class="error">Something went wrong. Please try again.</div>
      </form>
    </main>
    <footer>© ALSAQQAF LOGISTICS LLC</footer>
  </div>

  <script>
    const form = document.getElementById('appForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      document.getElementById('ok').style.display = 'none';
      document.getElementById('err').style.display = 'none';
      try {
        const res = await fetch('/api/applications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) throw json;
        document.getElementById('ok').style.display = 'inline-block';
        form.reset();
      } catch (err) {
        document.getElementById('err').style.display = 'block';
      }
    });
  </script>
</body>
</html>
